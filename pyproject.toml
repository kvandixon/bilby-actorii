[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actorii"
version = "4.2.0"
description = "Project ActorII - Actor language implementation for Linux"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
research = [
    "pypdf>=4.0.0",
    "cryptography>=41.0.0",
    "trafilatura>=1.8.0",
    "duckduckgo-search>=6.0.0",
]
wayland = [
    "pywayland>=0.4.19",
]
dev = [
    "pytest>=8.0.0",
    "mpmath>=1.3.0",
]

[project.scripts]
actorii = "actorii.main:main"
bilby = "actorii.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
